specVersion: v0.1.0
package:
  name: "base_biconomy"
  version: v0.1.0
  url: "https://github.com/propeller-heads/tycho/tree/main/protocols/substreams/base-biconomy"
  description: "Biconomy PropAMM venue on Base: executor boards, venue makers and provider inventory"

protobuf:
  files:
    - tycho/evm/v1/common.proto
    - tycho/evm/v1/utils.proto
  importPaths:
    - ../../../proto/

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/base_biconomy.wasm

modules:
  - name: map_protocol_components
    kind: map
    # The executor's deployment block (next generation: not deployed yet).
    initialBlock: &initial_block 0
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tycho.evm.v1.BlockTransactionProtocolComponents

  - name: store_protocol_components
    kind: store
    initialBlock: *initial_block
    updatePolicy: set_if_not_exists
    valueType: proto:tycho.evm.v1.ProtocolComponent
    inputs:
      - map: map_protocol_components

  - name: map_protocol_changes
    kind: map
    initialBlock: *initial_block
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - map: map_protocol_components
      - store: store_protocol_components
    output:
      type: proto:tycho.evm.v1.BlockChanges

params:
  # The next generation is not deployed yet. Fill in `venue`, `executor`, `bootstrap_block` (the
  # venue's deployment block) and `providers` (each maker's provider, redeployed with the
  # executor) here, and the executor's deployment block in `initial_block` above.
  map_protocol_components: &biconomy_params "venue=0x0000000000000000000000000000000000000000&executor=0x0000000000000000000000000000000000000000&bootstrap_block=0&tokens=0x4200000000000000000000000000000000000006:3:4,0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913:9:10,0xcbB7C0000aB88B473b1f5aFd9ef808440eed33Bf:9:10&providers="
  map_protocol_changes: *biconomy_params

network: base
